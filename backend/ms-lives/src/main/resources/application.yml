# Secretos y datos de conexión por variables de entorno (RNF-26).
# En desarrollo se pueden poner en ms-lives/.env (ver .env.example); git lo ignora.
spring:
  application:
    name: ms-lives
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/livesmanage_lives?createDatabaseIfNotExist=true}
    username: ${DB_USUARIO}
    password: ${DB_CONTRASENA}
  jpa:
    open-in-view: false
    hibernate:
      # shortcut: Hibernate crea y ajusta las tablas solo; pasar a migraciones (Flyway) antes de tener datos reales.
      ddl-auto: update

server:
  port: ${PORT:8082}

livesmanage:
  jwt:
    secreto: ${JWT_SECRET}
  # ms-clientas: crear y consultar clientas al anotar (directo, sin pasar por el gateway).
  clientas-url: ${CLIENTAS_URL:http://localhost:8083}
